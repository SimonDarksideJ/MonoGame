name: PR defaults
on:
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  defaults:
    runs-on: ubuntu-latest
    steps:
      - name: Apply label and milestone
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR" --repo "$REPO" --add-label "needs-review" --milestone "Pending"