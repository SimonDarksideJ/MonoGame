name: Release

# Release lane (Phase A skeleton; behaviour arrives in Phases D and E).
#
# Target flow (baseline report, sections 13 and 14): dispatch with a version, a green commit and dry-run
# on; reuse that commit's compiled outputs (or rebuild if expired); pack and validate; push to a staging
# feed and create a draft release with assets; publish a manifest for review. Dispatch again with dry-run
# off: the nuget-org GitHub Environment requires reviewer approval, then the same bits go to nuget.org,
# GitHub Packages, the GitHub Release, the marketplace (VsixPublisher) and the tag is created last.
#
# Today this workflow validates its inputs and prints the plan. It refuses a non-dry-run so nothing can
# be published by accident while the lane is a skeleton.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 3.8.7-preview.1, 3.8.7-rc.1 or 3.8.7'
        type: string
        required: true
      commit:
        description: 'Commit SHA to release (a green merge-lane run). Empty uses the dispatched ref.'
        type: string
        default: ''
      dry-run:
        description: 'Rehearse only: pack, validate, staging feed and draft release. Nothing is published.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan ${{ inputs.version }}${{ inputs.dry-run && ' (dry run)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit || github.sha }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version (expected X.Y.Z, X.Y.Z.W or X.Y.Z-label.N)."
            exit 1
          fi
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::'$COMMIT' is not a commit SHA."
            exit 1
          fi
          stable=true
          [[ "$VERSION" == *-* ]] && stable=false
          {
            echo "### Release plan"
            echo
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| version | $VERSION |"
            echo "| stable | $stable |"
            echo "| commit | $COMMIT |"
            echo "| dry run | $DRY_RUN |"
            echo
            echo "Gates (report section 14): G1 green merge run, G2 pack and validate, G3 dry-run manifest reviewed,"
            echo "G4 environment approval, G5 post-publish verification, G6 communication."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to publish from the skeleton
        if: ${{ !inputs.dry-run }}
        shell: bash
        run: |
          echo "::error::Publishing is not implemented yet (Phase E). Dispatch again with dry-run enabled."
          exit 1

      # Phase D and E will add, in order:
      #   build or reuse   reusable-build.yml for the chosen commit, or download its merge-lane artifacts
      #   pack             reusable-pack.yml with version and stable=true for X.Y.Z
      #   validate         runtimes present, dependency rules, symbols, template new/build/run, AOT publish
      #   dry-run          staging feed push, draft release with assets, manifest diff against last release
      #   publish          environment: nuget-org (required reviewers); nuget.org, GitHub Packages, release,
      #                    VSIX via VsixPublisher.exe on Windows, tag created on success
      #   verify           install from nuget.org, dotnet new + build + run, assets downloadable
